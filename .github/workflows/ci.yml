name: CI

on:
  push:
    branches: [main, realgazebo-*]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install ruff pre-commit mypy pydantic hypothesis

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: MyPy type check
        run: mypy --ignore-missing-imports realgazebo-dora/ src/ scripts/ || true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install pytest hypothesis pydantic

      - name: Run pytest (ROS2-independent)
        run: |
          python -m pytest realgazebo-dora/test/ scripts/tests/ -v --timeout=60

      - name: Run benchmark
        run: |
          make benchmark

  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base image with cache
        uses: docker/build-push-action@v6
        with:
          file: docker/Dockerfile.base
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:ci-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}:ci-latest
          load: true
          cache-from: |
            type=gha
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}:ci-latest
          cache-to: type=gha,mode=max
          push: false

      - name: Verify base image (ROS2 packages)
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ github.repository }}:ci-${{ github.sha }} bash -c "
            source /opt/ros/jazzy/setup.bash &&
            echo 'ROS2 packages:' &&
            ros2 pkg list | grep -c px4_msgs &&
            echo 'Gazebo:' &&
            which gz
          "

      - name: Colcon build test (ROS2 workspace)
        run: |
          docker run --rm -v ${{ github.workspace }}/src:/home/user/realgazebo/RealGazebo-ROS2/src \
            ${{ env.REGISTRY }}/${{ github.repository }}:ci-${{ github.sha }} bash -c "
            source /opt/ros/jazzy/setup.bash &&
            mkdir -p /home/user/realgazebo/RealGazebo-ROS2 &&
            cp -a /home/user/realgazebo/RealGazebo-ROS2/src /tmp/ws_src &&
            mkdir -p /home/user/realgazebo/RealGazebo-ROS2/src &&
            cp -a /tmp/ws_src/* /home/user/realgazebo/RealGazebo-ROS2/src/ 2>/dev/null;
            cd /home/user/realgazebo/RealGazebo-ROS2 &&
            colcon build --symlink-install --packages-skip px4_msgs 2>&1 | tail -5 &&
            source install/setup.bash &&
            ros2 pkg list | grep -E 'manager|drone|image|jsbsim|ardupilot'
          "

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Sphinx
        run: |
          pip install sphinx sphinx-rtd-theme sphinx-autodoc-typehints

      - name: Build docs
        run: |
          mkdir -p docs/_build/html
          sphinx-build -b html docs/ docs/_build/html 2>&1 | tail -5 || true

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
          publish_branch: gh-pages
