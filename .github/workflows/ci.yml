name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly: Monday 6AM UTC — full build with PX4 + ArduPilot
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install ruff pre-commit mypy pydantic hypothesis

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: MyPy type check
        run: mypy --ignore-missing-imports realgazebo-dora/ src/ scripts/ || true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install pytest hypothesis pydantic

      - name: Run pytest (ROS2-independent)
        run: |
          python -m pytest realgazebo-dora/test/ scripts/tests/ -v --timeout=60

      - name: Run benchmark
        run: |
          make benchmark

  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Dockerfile
        id: dockerfile
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "file=docker/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "file=docker/Dockerfile.base" >> $GITHUB_OUTPUT
          fi

      - name: Build image with cache
        uses: docker/build-push-action@v6
        with:
          file: ${{ steps.dockerfile.outputs.file }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:ci-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}:ci-latest
          load: true
          cache-from: |
            type=gha
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}:ci-latest
          cache-to: type=gha,mode=max
          push: false

      - name: Verify base image (ROS2 packages)
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ github.repository }}:ci-${{ github.sha }} bash -c "
            source /opt/ros/jazzy/setup.bash &&
            echo 'ROS2 packages:' &&
            ros2 pkg list | grep -c px4_msgs &&
            echo 'Gazebo:' &&
            which gz
          "

      - name: Colcon build test (ROS2 workspace)
        run: |
          docker run --rm -v ${{ github.workspace }}/src:/home/user/realgazebo/RealGazebo-ROS2/src \
            ${{ env.REGISTRY }}/${{ github.repository }}:ci-${{ github.sha }} bash -c "
            source /opt/ros/jazzy/setup.bash &&
            mkdir -p /home/user/realgazebo/RealGazebo-ROS2 &&
            cp -a /home/user/realgazebo/RealGazebo-ROS2/src /tmp/ws_src &&
            mkdir -p /home/user/realgazebo/RealGazebo-ROS2/src &&
            cp -a /tmp/ws_src/* /home/user/realgazebo/RealGazebo-ROS2/src/ 2>/dev/null;
            cd /home/user/realgazebo/RealGazebo-ROS2 &&
            colcon build --symlink-install --packages-skip px4_msgs 2>&1 | tail -5 &&
            source install/setup.bash &&
            ros2 pkg list | grep -E 'manager|drone|image|jsbsim|ardupilot'
          "

  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ github.repository }}:ci-${{ github.sha }}
          docker tag ${{ env.REGISTRY }}/${{ github.repository }}:ci-${{ github.sha }} realgazebo:base

      - name: Generate compose override
        run: |
          python3 scripts/generate_compose.py src/realgazebo/yaml/one_drone.yaml --image realgazebo:base

      - name: Start simulation
        run: |
          docker compose up -d
          echo "Waiting for Gazebo..."
          for i in $(seq 1 30); do
            if docker ps --format '{{.Names}}' | grep -q gazebo; then
              echo "Gazebo container up after ${i}s"
              break
            fi
            sleep 2
          done
          sleep 10  # Wait for topics to flow

      - name: Run smoke test
        run: bash scripts/smoke_test.sh

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose logs --tail=50 > /tmp/realgazebo-ci-logs.txt
          cat /tmp/realgazebo-ci-logs.txt

      - name: Stop simulation
        if: always()
        run: docker compose down -v
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install doc tools
        run: |
          pip install sphinx sphinx-rtd-theme sphinx-autodoc-typehints mkdocs mkdocs-material pydantic

      - name: Build MkDocs user guide
        run: mkdocs build -q

      - name: Build Sphinx API reference
        run: cd docs/api && sphinx-build -b html . _build/html -q

      - name: Deploy docs to GitHub Pages
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p gh-pages
          cp -r site/* gh-pages/
          cp -r docs/api/_build/html gh-pages/api
          touch gh-pages/.nojekyll
        # Deploy via gh-pages action
