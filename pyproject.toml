[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "realgazebo"
description = "Multi-vehicle simulation framework integrating Gazebo, PX4, ArduPilot, JSBSim, UE5, and dora-rs"
requires-python = ">=3.10"
dynamic = ["version"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "RUF", # ruff-specific
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "T20", # flake8-print
]
ignore = [
    "D100",  # Missing docstring in public module (too noisy)
    "D104",  # Missing docstring in public package
    "D107",  # Missing docstring in __init__
    "B904",  # raise-without-from-inside-except (too noisy in tests)
    "SIM108", # use ternary operator (prefer explicit if/else)
    "T201",  # print found (used extensively in CLI scripts)
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"Makefile" = ["E701", "E702"]
"src/realgazebo/launch/vehicle.launch.py" = ["E402", "E501"]
"src/realgazebo/launch/gazebo.launch.py" = ["E402", "E501"]
"src/jsbsim_bridge/jsbsim_bridge/*" = ["E501"]
"src/drone_controller/*" = ["E501"]
"scripts/tests/benchmark_run.py" = ["E501"]
"scripts/generate_compose.py" = ["E501"]
"scripts/tests/*" = ["B017", "E501"]
"src/drone_controller/test/*" = ["E402", "B017"]
"src/jsbsim_bridge/test/*" = ["B017"]
"realgazebo-dora/test/*" = ["E402", "B017"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rclpy.*", "px4_msgs.*", "std_msgs.*", "geometry_msgs.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "scripts/tests",
    "src/jsbsim_bridge/test",
    "realgazebo-dora/test",
]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: tests that require Docker and a running simulation stack",
]
asyncio_mode = "auto"
