# RealGazebo Multi-Container Setup
#
# Usage:
#   1. Generate vehicle configuration: python3 scripts/generate_compose.py src/realgazebo/yaml/example.yaml
#   2. Start simulation: docker compose up -d
#   3. Stop simulation: docker compose down
#
# Or use the helper script: bash scripts/quickstart.sh

networks:
  gazebo-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  vehicle-network:
    driver: bridge
    internal: true  # No external access, inter-drone only
    ipam:
      config:
        - subnet: 172.30.0.0/16

services:
  # Gazebo Simulator Container
  gazebo:
    image: ${IMAGE:-realgazebo:base}
    container_name: gazebo
    hostname: gazebo
    restart: unless-stopped
    privileged: true
    runtime: nvidia
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: 1
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      GZ_IP: 172.20.0.2
      GZ_PARTITION: realgazebo
      LOCAL_USER_ID: ${LOCAL_USER_ID:-1000}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/dri:/dev/dri  # GPU access (NVIDIA handled by runtime: nvidia)
      - gazebo-models:/tmp/models
    networks:
      gazebo-network:
        ipv4_address: 172.20.0.2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "su -s /bin/bash user -c 'source /opt/ros/jazzy/setup.bash && timeout 5 gz topic -e -t /world/c-track/clock -n 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    command: bash -c "source /opt/ros/jazzy/setup.bash && source /home/user/realgazebo/RealGazebo-ROS2/install/setup.bash && ros2 launch realgazebo gazebo.launch.py headless:=${HEADLESS:-true} verbose:=${VERBOSE:-false} world:=${WORLD:-c-track} px4_path:=/home/user/realgazebo/RealGazebo-PX4 unreal_ip:=${UNREAL_IP:-host.docker.internal} unreal_port:=${UNREAL_PORT:-5005}"
    deploy:
      resources:
        limits:
          memory: 64G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Dora-rs Dataflow Service (optional, alongside ROS2)
  dora:
    image: ${IMAGE:-realgazebo:base}
    container_name: dora
    hostname: dora
    profiles:
      - dora  # Only started with: docker compose --profile dora up
    privileged: true
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: 1
      GZ_IP: 172.20.0.100
      GZ_PARTITION: realgazebo
      LOCAL_USER_ID: ${LOCAL_USER_ID:-1000}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    networks:
      gazebo-network:
        ipv4_address: 172.20.0.100
    depends_on:
      gazebo:
        condition: service_healthy
    command: bash -c "
      source /opt/ros/jazzy/setup.bash &&
      source /home/user/realgazebo/RealGazebo-ROS2/install/setup.bash &&
      pip install --break-system-packages dora-runtime dora-ros2-bridge 2>/dev/null &&
      cd /home/user/realgazebo/RealGazebo-ROS2/realgazebo-dora &&
      dora up && dora start dataflow.yml --name realgazebo --detach &&
      sleep infinity
    "
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  gazebo-models:
